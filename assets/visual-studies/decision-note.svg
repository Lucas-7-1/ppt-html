<svg xmlns="http://www.w3.org/2000/svg" id="slide-decision-brief" width="1280" height="720" viewBox="0 0 1280 720"><rect id="background" x="0" y="0" width="1280" height="720" fill="#E7EBFF"/><rect id="decision-brief-2" x="68" y="57" width="846" height="603" fill="#D8DDE6"/><rect id="decision-brief-3" x="52" y="41" width="846" height="603" fill="#FFFFFF"/><text id="decision-brief-4" x="90" y="87" font-family="Noto Sans SC" font-size="16" font-weight="700" fill="#3455F5">DECISION NOTE  /  一页决策简报</text><text id="decision-brief-5" x="90" y="131" font-family="Noto Sans SC" font-size="31" font-weight="700" fill="#11151D">SaaS 续约：先验证，再定数量</text><rect id="decision-brief-6" x="90" y="162" width="770" height="113" fill="#11151D"/><text id="decision-brief-7" x="113" y="197" font-family="Noto Sans SC" font-size="16" font-weight="700" fill="#D9F279">我的建议</text><text id="lines-7-0" x="110" y="234" font-family="Noto Sans SC" font-size="28" font-weight="700" fill="#FFFFFF">先核实闲置授权，再确认续约数量。</text><text id="decision-brief-9" x="90" y="322" font-family="Noto Sans SC" font-size="20" font-weight="700" fill="#3455F5">支持这个建议的事实</text><text id="decision-brief-10" x="90" y="359" font-family="Noto Sans SC" font-size="22" font-weight="400" fill="#11151D">[合同权益]  [真实使用]  [业务确认]  [总成本口径]</text><line id="decision-brief-11" x1="90" y1="385" x2="860" y2="385" stroke="#D8DDE6" stroke-width="1"/><text id="decision-brief-12" x="90" y="427" font-family="Noto Sans SC" font-size="20" font-weight="700" fill="#3455F5">备选方案</text><text id="lines-12-0" x="90" y="463" font-family="Noto Sans SC" font-size="21" font-weight="400" fill="#11151D">保持 / 减量 / 替换</text><text id="lines-13-1" x="90" y="495" font-family="Noto Sans SC" font-size="21" font-weight="400" fill="#11151D">比较总成本与业务影响</text><text id="decision-brief-15" x="500" y="427" font-family="Noto Sans SC" font-size="20" font-weight="700" fill="#3455F5">执行条件与风险</text><text id="lines-15-0" x="500" y="463" font-family="Noto Sans SC" font-size="21" font-weight="400" fill="#11151D">[授权与安全要求]</text><text id="lines-16-1" x="500" y="495" font-family="Noto Sans SC" font-size="21" font-weight="400" fill="#11151D">[切换影响及退出方案]</text><rect id="decision-brief-18" x="90" y="537" width="770" height="62" fill="#D9F279"/><text id="decision-brief-19" x="111" y="577" font-family="Noto Sans SC" font-size="25" font-weight="700" fill="#11151D">请确认：[范围]  [负责人]  [决策时间]</text><circle id="decision-brief-20" cx="961" cy="196" r="14" fill="#3455F5"/><text id="decision-brief-21" x="961" y="203" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text id="decision-brief-22" x="990" y="203" font-family="Noto Sans SC" font-size="23" font-weight="700" fill="#11151D">先说建议</text><text id="decision-brief-23" x="990" y="234" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#717887">让读者知道你主张什么</text><circle id="decision-brief-24" cx="961" cy="344" r="14" fill="#3455F5"/><text id="decision-brief-25" x="961" y="351" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text id="decision-brief-26" x="990" y="351" font-family="Noto Sans SC" font-size="23" font-weight="700" fill="#11151D">紧贴依据</text><text id="decision-brief-27" x="990" y="382" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#717887">事实与推断分开写</text><circle id="decision-brief-28" cx="961" cy="465" r="14" fill="#3455F5"/><text id="decision-brief-29" x="961" y="472" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text id="decision-brief-30" x="990" y="472" font-family="Noto Sans SC" font-size="23" font-weight="700" fill="#11151D">说清条件</text><text id="decision-brief-31" x="990" y="503" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#717887">代价、风险与备选方案</text><circle id="decision-brief-32" cx="961" cy="569" r="14" fill="#3455F5"/><text id="decision-brief-33" x="961" y="576" font-family="Noto Sans SC" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text id="decision-brief-34" x="990" y="576" font-family="Noto Sans SC" font-size="23" font-weight="700" fill="#11151D">明确请求</text><text id="decision-brief-35" x="990" y="607" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#717887">谁在何时决定什么</text><text id="running-label" x="64" y="683" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#717887">可直接改写的示例；方括号内容必须补充事实后再发送。</text><text id="page-number" x="1216" y="683" font-family="Noto Sans SC" font-size="14" font-weight="400" fill="#717887" text-anchor="end">11</text></svg>