-anchor="start">紧贴依据</text><text id="step-detail-1" x="890.6667" y="442.6667" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#6C7587" text-anchor="start">事实与推断分开</text><circle id="step-2" cx="866.6667" cy="486.2222" r="11.1111" fill="#3455F5"/><text id="step-num-2" x="866.6667" y="491.5556" font-family="Noto Sans SC" font-size="14.2222" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text id="step-title-2" x="890.6667" y="493.3333" font-family="Noto Sans SC" font-size="20.4444" font-weight="700" fill="#111824" text-anchor="start">说清条件</text><text id="step-detail-2" x="890.6667" y="524.4444" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#6C7587" text-anchor="start">把代价和风险带上</text><circle id="step-3" cx="866.6667" cy="568" r="11.1111" fill="#3455F5"/><text id="step-num-3" x="866.6667" y="573.3333" font-family="Noto Sans SC" font-size="14.2222" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text id="step-title-3" x="890.6667" y="575.1111" font-family="Noto Sans SC" font-size="20.4444" font-weight="700" fill="#111824" text-anchor="start">明确请求</text><text id="step-detail-3" x="890.6667" y="606.2222" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#6C7587" text-anchor="start">谁在何时，决定什么</text><text id="disclosure" x="67.5556" y="690.6667" font-family="Noto Sans SC" font-size="14.2222" font-weight="400" fill="#6C7587" text-anchor="start">虚构演示项目 · 内容与时间仅作示例</text><text id="folio" x="1235.5556" y="694.2222" font-family="Noto Sans SC" font-size="13.3333" font-weight="400" fill="#6C7587" text-anchor="end">04</text></g></svg>