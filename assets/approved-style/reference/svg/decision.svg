<svg xmlns="http://www.w3.org/2000/svg" id="slide-decision" width="1280" height="720" viewBox="0 0 1280 720"><g id="composition"><rect id="background" x="0" y="0" width="1280" height="720" fill="#E8EDFF" rx="0"/><rect id="paper-shadow" x="80" y="105.7778" width="728.8889" height="542.2222" fill="#CDD6F2" rx="0"/><rect id="paper" x="67.5556" y="89.7778" width="728.8889" height="542.2222" fill="#FFFFFF" rx="0"/><text id="document-kicker" x="101.3333" y="136.8889" font-family="Noto Sans SC" font-size="15.1111" font-weight="400" fill="#3455F5" text-anchor="start">DECISION NOTE / 一次试点决定</text><text id="document-title" x="101.3333" y="177.7778" font-family="Noto Sans SC" font-size="27.5556" font-weight="700" fill="#111824" text-anchor="start">试点决策简报</text><rect id="proposal-bg" x="101.3333" y="203.5556" width="661.3333" height="121.7778" fill="#111824" rx="0"/><text id="proposal-label" x="123.5556" y="239.1111" font-family="Noto Sans SC" font-size="15.1111" font-weight="400" fill="#DDF584" text-anchor="start">待验证的建议</text><text id="proposal" x="123.5556" y="288" font-family="Noto Sans SC" font-size="26.6667" font-weight="700" fill="#FFFFFF" text-anchor="start">先完成小范围验证，再决定是否扩展。</text><text id="evidence-label" x="101.3333" y="365.3333" font-family="Noto Sans SC" font-size="16" font-weight="700" fill="#3455F5" text-anchor="start">支持建议的事实</text><text id="evidence" x="101.3333" y="400.8889" font-family="Noto Sans SC" font-size="19.5556" font-weight="400" fill="#111824" text-anchor="start">使用记录 × 质量验证 × 团队反馈</text><text id="option-label" x="101.3333" y="444.4444" font-family="Noto Sans SC" font-size="16" font-weight="700" fill="#3455F5" text-anchor="start">备选方案</text><text id="options-0" x="101.3333" y="478.2222" font-family="Noto Sans SC" font-size="18.6667" font-weight="400" fill="#111824" text-anchor="start">继续 / 调整 / 停止</text><text id="options-1" x="101.3333" y="508.4444" font-family="Noto Sans SC" font-size="18.6667" font-weight="400" fill="#111824" text-anchor="start">比较