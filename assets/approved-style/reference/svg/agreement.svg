<svg xmlns="http://www.w3.org/2000/svg" id="slide-agreement" width="1280" height="720" viewBox="0 0 1280 720"><g id="composition"><rect id="background" x="0" y="0" width="1280" height="720" fill="#F4F6F9" rx="0"/><text id="eyebrow" x="67.5556" y="134.2222" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#3455F5" text-anchor="start">试点之前 / 对齐范围</text><text id="title-0" x="67.5556" y="232" font-family="Noto Sans SC" font-size="67.5556" font-weight="700" fill="#111824" text-anchor="start">先把</text><text id="title-1" x="67.5556" y="320" font-family="Noto Sans SC" font-size="67.5556" font-weight="700" fill="#111824" text-anchor="start">验收的标准</text><text id="title-2" x="67.5556" y="408" font-family="Noto Sans SC" font-size="67.5556" font-weight="700" fill="#111824" text-anchor="start">写下来。</text><text id="intro-0" x="67.5556" y="494.2222" font-family="Noto Sans SC" font-size="21.3333" font-weight="400" fill="#6C7587" text-anchor="start">一次清楚的沟通，</text><text id="intro-1" x="67.5556" y="531.5556" font-family="Noto Sans SC" font-size="21.3333" font-weight="400" fill="#6C7587" text-anchor="start">给后续工作一个判断依据。</text><line id="question-rule" x1="67.5556" y1="584" x2="67.5556" y2="612.4444" stroke="#3455F5" stroke-width="3.5556"/><text id="question" x="86.2222" y="606.2222" font-family="Noto Sans SC" font-size="18.6667" font-weight="400" fill="#111824" text-anchor="start">这次试点，要验证哪一个问题？</text><rect id="paper-shadow" x="671.1111" y="106.6667" width="554.6667" height="542.2222" fill="#D7DEEB" rx="0"/><rect id="paper" x="657.7778" y="90.6667" width="554.6667" height="542.2222" fill="#FFFFFF" rx="0"/><polygon id="fold" points="1164.4444,90.6667 1212.4444,138.6667 1164.4444,138.6667" fill="#E5EBFF"/><polygon id="fold-cut" points="1164.4444,90.6667 1212.4444,90.6667 1212.4444,138.6667" fill="#F4F6F9"/><text id="document-title" x="698.6667" y="157.3333" font-family="Noto Sans SC" font-size="29.3333" font-weight="700" fill="#111824" text-anchor="start">试点工作约定</text><text id="document-subtitle" x="698.6667" y="193.7778" font-family="Noto Sans SC" font-size="16" font-weight="400" fill="#6C7587" text-anchor="start">沟通后，用一页文字向负责人确认。</text><text id="field-label-0" x="698.6667" y="260.4444" font-family="Noto Sans SC" font-size="16.8889" font-weight="700" fill="#3455F5" text-anchor="start">要做什么</text><text id="field-value-0" x="698.6667" y="295.1111" font-family="Noto Sans SC" font-size="21.3333" font-weight="400" fill="#111824" text-anchor="start">一个最值得优先解决的问题</text><line id="field-rule-0" x1="698.6667" y1="319.1111" x2="1171.5556" y2="319.1111" stroke="#DCE1EA" stroke-width="0.8889"/><text id="field-label-1" x="698.6667" y="349.3333" font-family="Noto Sans SC" font-size="16.8889" font-weight="700" fill="#3455F5" text-anchor="start">什么算完成</text><text id="field-value-1" x="698.6667" y="384" font-family="Noto Sans SC" font-size="21.3333" font-weight="400" fill="#111824" text-anchor="start">交付物、验收人、完成条件</text><line id="field-rule-1" x1="698.6667" y1="408" x2="1171.5556" y2="408" stroke="#DCE1EA" stroke-width="0.8889"/><text id="field-label-2" x="698.6667" y="438.2222" font-family="Noto Sans SC" font-size="16.8889" font-weight="700" fill="#3455F5" text-anchor="start">哪些决定由我做</text><text id="field-value-2" x="698.6667" y="472.8889" font-family="Noto Sans SC" font-size="21.3333" font-weight="400" fill="#111824" text-anchor="start">权限边界、预算与升级路径</text><line id="field-rule-2" x1="698.6667" y1="496.8889" x2="1171.5556" y2="496.8889" stroke="#DCE1EA" stroke-width="0.8889"/><text id="field-label-3" x="698.6667" y="527.1111" font-family="Noto Sans SC" font-size="16.8889" font-weight="700" fill="#3455F5" text-anchor="start">怎样保持同步</text><text id="field-value-3" x="698.6667" y="561.7778" font-family="Noto Sans SC" font-size="21.3333" font-weight="400" fill="#111824" text-anchor="start">频率、关键节点、请求方式</text><text id="disclosure" x="67.5556" y="690.6667" font-family="Noto Sans SC" font-size="14.2222" font-weight="400" fill="#6C7587" text-anchor="start">虚构演示项目 · 内容与时间仅作示例</text><text id="folio" x="1235.5556" y="694.2222" font-family="Noto Sans SC" font-size="13.3333" font-weight="400" fill="#6C7587" text-anchor="end">03</text></g></svg>